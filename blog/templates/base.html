{% load static %} {% load tz %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>{% block title %}Blogpur{% endblock %}</title>

    <!-- ✅ Bootstrap 5 CSS CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- ✅ Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  </head>

  <!-- ✅ BODY with full height and flex layout -->
  <body class="bg-dark text-white d-flex flex-column min-vh-100">
    <!-- ✅ Navbar -->
    <nav class="navbar navbar-expand-lg bg-primary">
      <div class="container-fluid">
        <a class="navbar-brand text-white" href="#">BlogPur</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            {% if user.is_authenticated %}
            <li class="nav-item">
              <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button
                  class="btn btn-danger btn-outline-light ms-2"
                  type="submit"
                >
                  Logout
                </button>
              </form>
            </li>
            {% else %}
            <li class="nav-item">
              <a class="btn btn-success me-2" href="{% url 'login' %}">Login</a>
            </li>
            <li class="nav-item">
              <a class="btn btn-warning text-white" href="{% url 'signup' %}"
                >Sign Up</a
              >
            </li>

            {% endif %}
          </ul>
        </div>
      </div>
    </nav>

    <!-- ✅ Main Content (grow kare, footer ko neeche push kare) -->
    <div class="container mt-4 flex-grow-1">
      {% block content %} {% endblock %}
    </div>

    <!-- ✅ Sticky Footer -->
    <footer class="bg-secondary text-white py-2 mt-auto">
      <div class="container text-center">
        <p class="mb-1">
          &copy; {{ now|date:"Y" }} BlogPur. All rights reserved.
        </p>
      </div>
    </footer>

    <!-- ✅ Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
